<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf Mobile Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <div id="app" class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700"></div>

  <script>
    let players = [];
    let currentRevealIndex = 0;
    let gameState = 'setup';
    let timer = null;
    let timeLeft = 120;
    let isDay = true;

    const availableRoles = [
      { name: 'หมาป่า (Werewolf)', icon: '🐺', desc: 'กำจัดชาวบ้านในตอนกลางคืน' },
      { name: 'หมาป่า (Werewolf)', icon: '🐺', desc: 'กำจัดชาวบ้านในตอนกลางคืน' },
      { name: 'ผู้ทำนาย (Seer)', icon: '🔮', desc: 'ส่องดูบทบาทของผู้เล่นคนอื่นคืนละ 1 คน' },
      { name: 'หมอ (Doctor)', icon: '🩺', desc: 'ปกป้องผู้เล่น 1 คนจากการถูกทำร้าย' },
      { name: 'ชาวบ้าน (Villager)', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { name: 'ชาวบ้าน (Villager)', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { name: 'ชาวบ้าน (Villager)', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { name: 'ชาวบ้าน (Villager)', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' }
    ];

    function render() {
      const app = document.getElementById('app');
      
      if (gameState === 'setup') {
        app.innerHTML = `
          <h1 class="text-2xl font-bold text-center text-amber-400 mb-2">🐺 เกมหมาป่า (Werewolf)</h1>
          <p class="text-xs text-slate-400 text-center mb-6">พิมพ์ชื่อเพื่อนลงในช่องเพื่อเข้าร่วมเล่น</p>
          
          <div class="flex gap-2 mb-4">
            <input id="nameInput" type="text" placeholder="พิมพ์ชื่อเพื่อน..." class="flex-1 px-4 py-2 bg-slate-700 border border-slate-600 rounded-xl text-white focus:outline-none focus:border-amber-400 text-sm">
            <button onclick="addPlayer()" class="bg-amber-500 hover:bg-amber-600 font-bold px-4 py-2 rounded-xl text-slate-900 text-sm">+ เพิ่ม</button>
          </div>

          <div class="space-y-2 mb-6 max-h-48 overflow-y-auto">
            ${players.length === 0 ? '<p class="text-center text-slate-500 text-sm">ยังไม่มีผู้เล่น</p>' : ''}
            ${players.map((p, i) => `
              <div class="flex justify-between items-center bg-slate-700/50 px-3 py-2 rounded-lg text-sm">
                <span>${i+1}. ${p.name}</span>
                <button onclick="removePlayer(${i})" class="text-red-400 font-bold">✕</button>
              </div>
            `).join('')}
          </div>

          <button onclick="startGame()" ${players.length < 4 ? 'disabled' : ''} class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 font-bold rounded-xl text-slate-900 transition text-sm">
            🎮 เริ่มสุ่มแจกบทบาท (${players.length} คน)
          </button>
        `;
      } 
      else if (gameState === 'reveal') {
        const p = players[currentRevealIndex];
        app.innerHTML = `
          <div class="text-center space-y-4">
            <span class="text-xs font-semibold px-3 py-1 bg-amber-400/20 text-amber-400 rounded-full">ขั้นตอนสุ่มบทบาท</span>
            <h2 class="text-slate-300 text-sm mt-2">ส่งมือถือเครื่องนี้ให้:</h2>
            <h1 class="text-3xl font-extrabold text-amber-400">${p.name}</h1>
            
            <div id="secretCard" class="my-6 p-6 bg-slate-700/40 rounded-xl border border-dashed border-slate-600">
              <p class="text-slate-400 text-xs">กดปุ่มด้านล่างเพื่อแอบดูบทบาทตัวเอง</p>
            </div>

            <div id="actionArea">
              <button onclick="revealRole()" class="w-full py-3 bg-amber-500 font-bold rounded-xl text-slate-900 text-sm">
                👁️ กดเพื่อเปิดดูบทบาท
              </button>
            </div>
          </div>
        `;
      } 
      else if (gameState === 'game') {
        app.innerHTML = `
          <div class="text-center">
            <div class="inline-block px-4 py-1 rounded-full ${isDay ? 'bg-amber-500/20 text-amber-400' : 'bg-indigo-500/20 text-indigo-400'} font-bold text-xs mb-2">
              ${isDay ? '☀️ เฟสกลางวัน (ถกเถียง & โหวต)' : '🌙 เฟสกลางคืน'}
            </div>
            <h2 class="text-4xl font-extrabold text-white my-1">${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}</h2>
            <div class="flex justify-center gap-2 my-3">
              <button onclick="toggleTimer()" class="px-3 py-1 text-xs bg-slate-700 rounded-lg">▶️/⏸️ จับเวลา</button>
              <button onclick="resetTimer()" class="px-3 py-1 text-xs bg-slate-700 rounded-lg">🔄 รีเซ็ต</button>
              <button onclick="togglePhase()" class="px-3 py-1 text-xs bg-indigo-600 rounded-lg">🌙/☀️ สลับกลางวัน-คืน</button>
            </div>
          </div>

          <div class="border-t border-slate-700 pt-4 mt-2">
            <h3 class="font-bold mb-2 text-slate-300 text-xs">รายชื่อผู้เล่น:</h3>
            <div class="space-y-2 max-h-52 overflow-y-auto">
              ${players.map((p, i) => `
                <div class="flex justify-between items-center p-2.5 rounded-xl ${p.alive ? 'bg-slate-700/60' : 'bg-red-950/40 border border-red-900/50 opacity-50'}">
                  <div>
                    <span class="font-bold text-sm ${p.alive ? 'text-white' : 'line-through text-red-400'}">${p.name}</span>
                    <span class="text-[10px] text-slate-400 block">${p.alive ? 'มีชีวิตอยู่' : '💀 เสียชีวิต (' + p.role.name + ')'}</span>
                  </div>
                  ${p.alive ? `<button onclick="killPlayer(${i})" class="px-2.5 py-1 text-xs bg-red-500/20 text-red-400 rounded-lg border border-red-500/30">กำจัด</button>` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <button onclick="restartGame()" class="w-full mt-4 py-2 bg-slate-700 text-xs text-slate-400 rounded-xl">🔄 เริ่มสร้างห้องใหม่</button>
        `;
      }
    }

    function addPlayer() {
      const input = document.getElementById('nameInput');
      if (input.value.trim()) {
        players.push({ name: input.value.trim(), role: null, alive: true });
        input.value = '';
        render();
      }
    }

    function removePlayer(i) { players.splice(i, 1); render(); }

    function startGame() {
      const shuffled = [...availableRoles].sort(() => Math.random() - 0.5);
      players.forEach((p, i) => { p.role = shuffled[i % shuffled.length]; p.alive = true; });
      currentRevealIndex = 0;
      gameState = 'reveal';
      render();
    }

    function revealRole() {
      const p = players[currentRevealIndex];
      document.getElementById('secretCard').innerHTML = `
        <div class="text-4xl mb-1">${p.role.icon}</div>
        <h3 class="text-lg font-bold text-amber-400">${p.role.name}</h3>
        <p class="text-xs text-slate-300 mt-1">${p.role.desc}</p>
      `;
      document.getElementById('actionArea').innerHTML = `
        <button onclick="nextPlayer()" class="w-full py-3 bg-emerald-500 font-bold rounded-xl text-slate-900 text-sm">
          🙈 ซ่อนบทบาท & ส่งต่อให้คนถัดไป
        </button>
      `;
    }

    function nextPlayer() {
      currentRevealIndex++;
      if (currentRevealIndex >= players.length) gameState = 'game';
      render();
    }

    function toggleTimer() {
      if (timer) { clearInterval(timer); timer = null; }
      else {
        timer = setInterval(() => {
          if (timeLeft > 0) { timeLeft--; render(); }
          else { clearInterval(timer); timer = null; alert('⏰ หมดเวลาถกเถียง!'); }
        }, 1000);
      }
    }

    function resetTimer() { if (timer) clearInterval(timer); timer = null; timeLeft = 120; render(); }
    function togglePhase() { isDay = !isDay; resetTimer(); }
    function killPlayer(i) { if (confirm(`ยืนยันการกำจัด ${players[i].name}?`)) { players[i].alive = false; render(); } }
    function restartGame() { if (confirm('เริ่มเกมใหม่ทั้งหมด?')) { if (timer) clearInterval(timer); timer = null; gameState = 'setup'; render(); } }

    render();
  </script>
</body>
</html>
