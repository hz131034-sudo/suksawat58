<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf Mobile Game - Voice Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- แถบซับไตเติ้ลแสดงคำพูดระบบ -->
  <div id="voiceBanner" class="fixed top-4 left-4 right-4 max-w-md mx-auto bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl shadow-xl border border-amber-300 text-xs flex items-center justify-between transition-all duration-300 opacity-0 pointer-events-none z-50">
    <div class="flex items-center gap-2">
      <span class="animate-bounce text-base">🔊</span>
      <span id="voiceText">กำลังเล่นเสียง...</span>
    </div>
  </div>

  <div id="app" class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700"></div>

  <script>
    let players = [];
    let currentRevealIndex = 0;
    let gameState = 'setup'; // setup, reveal, pre_night, night_intro, night_wolf, night_seer, night_doctor, night_waiting, day, game_over
    let timer = null;
    let timeLeft = 120;
    let preNightTimeLeft = 120;
    let nightAction = { wolfTarget: null, doctorSave: null, seerCheck: null };
    let nightLog = "";
    let transitionTimer = 5;
    let isAudioUnlocked = false;

    const availableRoles = [
      { id: 'wolf1', name: 'หมาป่า', icon: '🐺', desc: 'เลือกเหยื่อที่จะกำจัดในตอนกลางคืน' },
      { id: 'wolf2', name: 'หมาป่า', icon: '🐺', desc: 'เลือกเหยื่อที่จะกำจัดในตอนกลางคืน' },
      { id: 'seer', name: 'ผู้ทำนาย', icon: '🔮', desc: 'ส่องดูบทบาทลับของเพื่อนคืนละ 1 คน' },
      { id: 'doctor', name: 'หมอ', icon: '🩺', desc: 'เลือกปกป้องผู้เล่น 1 คนจากการถูกทำร้าย' },
      { id: 'v1', name: 'ชาวบ้าน', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { id: 'v2', name: 'ชาวบ้าน', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { id: 'v3', name: 'ชาวบ้าน', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' },
      { id: 'v4', name: 'ชาวบ้าน', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน' }
    ];

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function unlockAudio() {
      if (!isAudioUnlocked) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          ctx.resume();
        } catch(e) {}
        if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        }
        isAudioUnlocked = true;
      }
    }

    function showVoiceBanner(text) {
      const banner = document.getElementById('voiceBanner');
      const voiceText = document.getElementById('voiceText');
      if (banner && voiceText) {
        voiceText.innerText = text;
        banner.classList.remove('opacity-0', 'pointer-events-none');
        banner.classList.add('opacity-100');
      }
    }

    function hideVoiceBanner() {
      const banner = document.getElementById('voiceBanner');
      if (banner) {
        banner.classList.remove('opacity-100');
        banner.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    // ระบบพูดภาษาไทย (Web Speech API + Google TTS Fallback)
    function speakText(text, callback) {
      unlockAudio();
      showVoiceBanner(text);

      let called = false;
      const finish = () => {
        if (!called) {
          called = true;
          hideVoiceBanner();
          if (callback) callback();
        }
      };

      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'th-TH';
          utterance.rate = 0.85;

          const voices = window.speechSynthesis.getVoices();
          const thaiVoice = voices.find(v => v.lang.includes('th') || v.lang.includes('TH'));
          if (thaiVoice) utterance.voice = thaiVoice;

          utterance.onend = finish;
          utterance.onerror = () => {
            playGoogleTTS(text, finish);
          };

          window.speechSynthesis.speak(utterance);

          setTimeout(() => {
            if (!called) finish();
          }, 4500);

          return;
        } catch(e) {
          console.warn('SpeechSynthesis error:', e);
        }
      }

      playGoogleTTS(text, finish);
    }

    function playGoogleTTS(text, callback) {
      try {
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q=${encodeURIComponent(text)}`;
        const audio = new Audio(url);
        audio.onended = () => { if (callback) callback(); };
        audio.onerror = () => { if (callback) callback(); };
        audio.play().catch(() => {
          if (callback) callback();
        });
      } catch(e) {
        if (callback) callback();
      }
    }

    function playAudioEffect(type) {
      unlockAudio();
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'morning') {
          let now = ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.4, now + i*0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.18 + 0.8);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now + i*0.18); osc.stop(now + i*0.18 + 0.8);
          });
        } else if (type === 'beep') {
          let osc = ctx.createOscillator();
          let gain = ctx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.2);
        }
      } catch(e) {}
    }

    function testVoice() {
      speakText('ทดสอบระบบเสียงพูดภาษาไทย ได้ยินเสียงนี้แสดงว่าระบบพร้อมใช้งานครับ');
    }

    function render() {
      const app = document.getElementById('app');
      
      // 1. หน้าตั้งค่าเกม
      if (gameState === 'setup') {
        app.innerHTML = `
          <h1 class="text-2xl font-bold text-center text-amber-400 mb-1">🐺 เกมหมาป่าระบบเสียงภาษาไทย</h1>
          <p class="text-xs text-slate-400 text-center mb-4">เพิ่มผู้เล่น แล้วกดทดสอบเสียงก่อนเริ่มเกมได้เลย</p>
          
          <button onclick="testVoice()" class="w-full py-2 bg-indigo-600/80 hover:bg-indigo-600 text-indigo-100 font-bold rounded-xl text-xs mb-4 border border-indigo-400/40 flex items-center justify-center gap-2 shadow-md">
            🔊 กดเพื่อทดสอบเสียงพูดภาษาไทย
          </button>

          <div class="flex gap-2 mb-4">
            <input id="nameInput" type="text" placeholder="พิมพ์ชื่อผู้เล่น..." class="flex-1 px-4 py-2 bg-slate-700 border border-slate-600 rounded-xl text-white text-sm">
            <button onclick="addPlayer()" class="bg-amber-500 hover:bg-amber-600 font-bold px-4 py-2 rounded-xl text-slate-900 text-sm">+ เพิ่ม</button>
          </div>

          <div class="space-y-2 mb-6 max-h-48 overflow-y-auto">
            ${players.length === 0 ? '<p class="text-center text-slate-500 text-sm">กรุณาเพิ่มชื่อผู้เล่นอย่างน้อย 4 คน</p>' : ''}
            ${players.map((p, i) => `
              <div class="flex justify-between items-center bg-slate-700/50 px-3 py-2 rounded-lg text-sm">
                <span>${i+1}. ${p.name}</span>
                <button onclick="removePlayer(${i})" class="text-red-400 font-bold">✕</button>
              </div>
            `).join('')}
          </div>

          <button onclick="startGame()" ${players.length < 4 ? 'disabled' : ''} class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 font-bold rounded-xl text-slate-900 text-sm shadow-lg">
            🎮 เริ่มสุ่มแจกบทบาท (${players.length} คน)
          </button>
        `;
      } 

      // 2. หน้าสุ่มบทบาท
      else if (gameState === 'reveal') {
        const p = players[currentRevealIndex];
        app.innerHTML = `
          <div class="text-center space-y-4">
            <span class="text-xs font-semibold px-3 py-1 bg-amber-400/20 text-amber-400 rounded-full">ขั้นตอนสุ่มบทบาทลับ</span>
            <h2 class="text-slate-300 text-sm mt-2">ยื่นมือถือให้เพื่อนชื่อ:</h2>
            <h1 class="text-3xl font-extrabold text-amber-400">${p.name}</h1>
            
            <div id="secretCard" class="my-6 p-6 bg-slate-700/40 rounded-xl border border-dashed border-slate-600">
              <p class="text-slate-400 text-xs">กดปุ่มด้านล่างเมื่อถือมือถือคนเดียวแล้ว</p>
            </div>

            <div id="actionArea">
              <button onclick="revealRole()" class="w-full py-3 bg-amber-500 font-bold rounded-xl text-slate-900 text-sm shadow-lg">
                👁️ กดเพื่อแอบดูบทบาท
              </button>
            </div>
          </div>
        `;
      }

      // 2.5 หน้าพูดคุยก่อนเข้าสู่กลางคืน (Pre-Night Discussion)
      else if (gameState === 'pre_night') {
        app.innerHTML = `
          <div class="text-center space-y-4">
            <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 font-bold text-xs">
              🗣️ เฟสพูดคุยก่อนเริ่มคืนแรก
            </div>
            <h2 class="text-xl font-bold text-amber-400">พูดคุย & แนะนำตัว</h2>
            <p class="text-xs text-slate-300 bg-slate-700/50 p-3 rounded-xl border border-slate-600 leading-relaxed">
              แจกบทบาทครบทุกคนแล้ว! <br><b class="text-amber-300">ให้ทุกคนพูดคุย ทักทาย หรือวางแผนกันก่อน</b>ที่จะเริ่มเข้าสู่ช่วงกลางคืนคืนแรก
            </p>

            <h1 class="text-4xl font-extrabold text-white my-2">${Math.floor(preNightTimeLeft / 60)}:${(preNightTimeLeft % 60).toString().padStart(2, '0')}</h1>

            <div class="flex justify-center gap-2">
              <button onclick="togglePreNightTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">▶️/⏸️ จับเวลา</button>
              <button onclick="resetPreNightTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">🔄 รีเซ็ต</button>
            </div>

            <button onclick="startNightPhase()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm shadow-lg mt-4">
              🌙 พร้อมแล้ว เข้าสู่ช่วงกลางคืน
            </button>
          </div>
        `;
      }

      // 3. หน้าเริ่มต้นกลางคืน
      else if (gameState === 'night_intro') {
        app.innerHTML = `
          <div class="text-center space-y-4">
            <div class="text-5xl">🌙</div>
            <h2 class="text-xl font-bold text-indigo-400">เข้าสู่ช่วงกลางคืน</h2>
            <p class="text-sm text-slate-300 leading-relaxed bg-slate-700/50 p-4 rounded-xl border border-slate-600">
              🔊 <b class="text-amber-400">วางมือถือไว้ตรงกลาง แล้วกดเริ่ม</b><br>
              ระบบจะเปิดเสียงพูดสั่งหลับตาและขานเรียกบทบาทให้อัตโนมัติ
            </p>
            <button onclick="startNightSequence()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm shadow-lg">
              ▶️ เริ่มสั่งหลับตา & ขานบทบาท
            </button>
          </div>
        `;
      }

      // 4. หมาป่าเลือกเหยื่อ
      else if (gameState === 'night_wolf') {
        const aliveTargets = players.filter(p => p.alive && p.role.name !== 'หมาป่า');
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-red-400 text-center">🐺 หมาป่า: เลือกเหยื่อ 1 คน</h2>
            <p class="text-xs text-slate-400 text-center">แอบหยิบมือถือมาเลือกลบชาวบ้าน 1 คน:</p>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              ${aliveTargets.map(p => `
                <button onclick="selectWolfTarget('${p.name}')" class="w-full p-3 bg-slate-700 hover:bg-red-900/40 border border-slate-600 hover:border-red-500 rounded-xl text-left font-bold text-sm">
                  🎯 ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 5. หน้าพักรอ 5 วินาทีสลับบทบาท
      else if (gameState === 'night_waiting') {
        app.innerHTML = `
          <div class="text-center space-y-4 py-8">
            <div class="text-4xl animate-pulse">⏳</div>
            <h2 class="text-lg font-bold text-amber-400">กำลังสลับบทบาท...</h2>
            <p class="text-xs text-slate-400">หลับตาแล้ววางมือถือไว้ที่เดิม (${transitionTimer} วินาที)</p>
            <div class="text-4xl font-extrabold text-white">${transitionTimer}</div>
          </div>
        `;
      }

      // 6. ผู้ทำนายส่องดู
      else if (gameState === 'night_seer') {
        const aliveSeer = players.find(p => p.role.name === 'ผู้ทำนาย' && p.alive);
        if (!aliveSeer) {
          startTransition('night_doctor', 'ผู้ทำนาย หลับตาลง... หมอ ตื่นขึ้นมาคุ้มกัน');
          return;
        }
        const otherPlayers = players.filter(p => p.alive && p.role.name !== 'ผู้ทำนาย');
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-purple-400 text-center">🔮 ผู้ทำนาย: เลือกส่องดูบทบาท</h2>
            <div id="seerResult"></div>
            <div class="space-y-2 max-h-48 overflow-y-auto">
              ${otherPlayers.map(p => `
                <button onclick="checkSeerRole('${p.name}', '${p.role.name}')" class="w-full p-3 bg-slate-700 hover:bg-purple-900/40 border border-slate-600 rounded-xl text-left font-bold text-sm">
                  🔍 ส่องดูบทบาทของ ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 7. หมอคุ้มกัน
      else if (gameState === 'night_doctor') {
        const aliveDoctor = players.find(p => p.role.name === 'หมอ' && p.alive);
        if (!aliveDoctor) {
          startTransition('day', 'หมอ หลับตาลง... เช้าแล้ว ทุกคนตื่นได้!');
          return;
        }
        const alivePlayers = players.filter(p => p.alive);
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-emerald-400 text-center">🩺 หมอ: เลือกคนที่จะคุ้มกัน</h2>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              ${alivePlayers.map(p => `
                <button onclick="selectDoctorSave('${p.name}')" class="w-full p-3 bg-slate-700 hover:bg-emerald-900/40 border border-slate-600 rounded-xl text-left font-bold text-sm">
                  🛡️ ปกป้อง ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 8. กลางวัน
      else if (gameState === 'day') {
        app.innerHTML = `
          <div class="text-center">
            <div class="inline-block px-4 py-1 rounded-full bg-amber-500/20 text-amber-400 font-bold text-xs mb-1">
              ☀️ เฟสกลางวัน (ถกเถียง & โหวต)
            </div>
            
            ${nightLog ? `<div class="my-2 p-3 bg-slate-700/80 rounded-xl border border-amber-500/30 text-xs text-amber-200 font-semibold">${nightLog}</div>` : ''}

            <h2 class="text-4xl font-extrabold text-white my-1">${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}</h2>
            
            <div class="flex justify-center gap-2 my-2">
              <button onclick="toggleTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">▶️/⏸️ จับเวลา/หยุด</button>
              <button onclick="resetTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">🔄 รีเซ็ต</button>
            </div>
          </div>

          <div class="border-t border-slate-700 pt-3 mt-2">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-slate-300 text-xs">รายชื่อผู้เล่น:</h3>
              <span class="text-[10px] text-slate-400">*บทบาทผู้เสียชีวิตถูกซ่อนไว้</span>
            </div>
            
            <div class="space-y-2 max-h-44 overflow-y-auto">
              ${players.map((p, i) => `
                <div class="flex justify-between items-center p-2 rounded-xl ${p.alive ? 'bg-slate-700/60' : 'bg-red-950/30 border border-red-900/30 opacity-60'}">
                  <div>
                    <span class="font-bold text-sm ${p.alive ? 'text-white' : 'line-through text-red-400'}">${p.name}</span>
                    <span class="text-[10px] text-slate-400 block">${p.alive ? 'มีชีวิตอยู่' : '💀 เสียชีวิตแล้ว'}</span>
                  </div>
                  ${p.alive ? `<button onclick="voteKill(${i})" class="px-2.5 py-1 text-xs bg-red-500/20 hover:bg-red-500/40 text-red-400 rounded-lg border border-red-500/30">🗳️ โหวตประหาร</button>` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="flex gap-2 mt-4">
            <button onclick="startNightPhase()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-xs">
              🌙 เข้าร่วมเฟสกลางคืน
            </button>
            <button onclick="revealGameOver()" class="py-2.5 px-3 bg-red-900/60 hover:bg-red-800 text-red-200 font-bold rounded-xl text-xs">
              🏁 จบเกม
            </button>
          </div>
        `;
      }

      // 9. เฉลยบทบาทจบเกม
      else if (gameState === 'game_over') {
        app.innerHTML = `
          <div class="text-center space-y-3">
            <h1 class="text-2xl font-extrabold text-amber-400">🏁 จบเกม & เฉลยบทบาท</h1>
            <div class="space-y-2 max-h-64 overflow-y-auto my-4">
              ${players.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-700/80 rounded-xl border ${p.alive ? 'border-emerald-500/40' : 'border-red-500/40'}">
                  <div class="text-left">
                    <span class="font-bold text-sm text-white">${p.name}</span>
                    <span class="text-[10px] block ${p.alive ? 'text-emerald-400' : 'text-red-400'}">${p.alive ? '🟢 รอดชีวิต' : '💀 เสียชีวิต'}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-lg mr-1">${p.role.icon}</span>
                    <span class="font-bold text-sm text-amber-300">${p.role.name}</span>
                  </div>
                </div>
              `).join('')}
            </div>
            <button onclick="restartGame()" class="w-full py-3 bg-amber-500 font-bold rounded-xl text-slate-900 text-sm">
              🔄 เริ่มเล่นเกมใหม่
            </button>
          </div>
        `;
      }
    }

    function addPlayer() {
      const input = document.getElementById('nameInput');
      if (input.value.trim()) {
        players.push({ name: input.value.trim(), role: null, alive: true });
        input.value = ''; render();
      }
    }
    function removePlayer(i) { players.splice(i, 1); render(); }

    function startGame() {
      unlockAudio();
      const shuffled = [...availableRoles].sort(() => Math.random() - 0.5);
      players.forEach((p, i) => { p.role = shuffled[i % shuffled.length]; p.alive = true; });
      currentRevealIndex = 0; gameState = 'reveal'; render();
    }

    function revealRole() {
      const p = players[currentRevealIndex];
      document.getElementById('secretCard').innerHTML = `
        <div class="text-4xl mb-1">${p.role.icon}</div>
        <h3 class="text-lg font-bold text-amber-400">${p.role.name}</h3>
        <p class="text-xs text-slate-300 mt-1">${p.role.desc}</p>
      `;
      document.getElementById('actionArea').innerHTML = `
        <button onclick="nextPlayer()" class="w-full py-3 bg-emerald-500 font-bold rounded-xl text-slate-900 text-sm">
          🙈 ซ่อนบทบาท & ส่งต่อคนถัดไป
        </button>
      `;
    }

    function nextPlayer() {
      currentRevealIndex++;
      if (currentRevealIndex >= players.length) {
        startPreNightPhase();
      } else { render(); }
    }

    function startPreNightPhase() {
      gameState = 'pre_night';
      preNightTimeLeft = 120;
      render();
      speakText('แจกบทบาทเสร็จสิ้นแล้ว เชิญทุกคนพูดคุยทักทายกันก่อนเข้าสู่ช่วงกลางคืนครับ');
    }

    function togglePreNightTimer() {
      playAudioEffect('beep');
      if (timer) { clearInterval(timer); timer = null; }
      else {
        timer = setInterval(() => {
          if (preNightTimeLeft > 0) {
            preNightTimeLeft--;
            if (preNightTimeLeft === 0) {
              playAudioEffect('morning');
              speakText('หมดเวลาพูดคุยแล้วครับ พร้อมเข้าสู่ช่วงกลางคืน');
            }
            render();
          }
        }, 1000);
      }
    }

    function resetPreNightTimer() {
      if (timer) clearInterval(timer); timer = null; preNightTimeLeft = 120; render();
    }

    function startNightPhase() {
      if (timer) clearInterval(timer); timer = null;
      nightAction = { wolfTarget: null, doctorSave: null, seerCheck: null };
      gameState = 'night_intro'; render();
    }

    function startNightSequence() {
      speakText('ผู้เล่นทุกคน หลับตาลง... หมาป่า ตื่นขึ้นมาเลือกเหยื่อ', () => {
        gameState = 'night_wolf'; render();
      });
    }

    function selectWolfTarget(name) {
      nightAction.wolfTarget = name;
      startTransition('night_seer', 'หมาป่า หลับตาลง... ผู้ทำนาย ตื่นขึ้นมาส่องดูบทบาท');
    }

    function checkSeerRole(name, roleName) {
      document.getElementById('seerResult').innerHTML = `
        <div class="p-3 bg-purple-950/80 border border-purple-500 rounded-xl text-center mb-3">
          <p class="text-xs text-purple-200">${name} มีบทบาทคือ: <b class="text-amber-300 text-sm">${roleName}</b></p>
        </div>
      `;
      setTimeout(() => {
        startTransition('night_doctor', 'ผู้ทำนาย หลับตาลง... หมอ ตื่นขึ้นมาคุ้มกัน');
      }, 2500);
    }

    function selectDoctorSave(name) {
      nightAction.doctorSave = name;
      startTransition('day', 'หมอ หลับตาลง... เช้าแล้ว ทุกคนตื่นได้!');
    }

    function startTransition(nextState, speechMessage) {
      gameState = 'night_waiting';
      transitionTimer = 5;
      render();

      const countdown = setInterval(() => {
        transitionTimer--;
        if (transitionTimer <= 0) {
          clearInterval(countdown);
          if (nextState === 'day') {
            playAudioEffect('morning');
            processNightResults();
          } else {
            speakText(speechMessage, () => {
              gameState = nextState;
              render();
            });
          }
        } else {
          render();
        }
      }, 1000);
    }

    function processNightResults() {
      if (nightAction.wolfTarget && nightAction.wolfTarget !== nightAction.doctorSave) {
        const victim = players.find(p => p.name === nightAction.wolfTarget);
        if (victim) {
          victim.alive = false;
          nightLog = `📢 เมื่อคืนนี้ 💀 ${victim.name} ถูกหมาป่าทำร้ายเสียชีวิต!`;
        }
      } else {
        nightLog = `📢 เมื่อคืนนี้เป็นคืนที่เงียบสงบ ไม่มีใครเสียชีวิต!`;
      }
      resetTimer();
      gameState = 'day'; render();
    }

    function toggleTimer() {
      playAudioEffect('beep');
      if (timer) { clearInterval(timer); timer = null; }
      else {
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            if (timeLeft === 0) {
              playAudioEffect('morning');
              speakText('หมดเวลาถกเถียงแล้วครับ!');
            }
            render();
          }
        }, 1000);
      }
    }

    function resetTimer() { if (timer) clearInterval(timer); timer = null; timeLeft = 120; render(); }
    
    function voteKill(i) {
      playAudioEffect('beep');
      if (confirm(`ยืนยันผลโหวตประหาร ${players[i].name}?`)) {
        players[i].alive = false;
        alert(`⚖️ ${players[i].name} ถูกโหวตประหารชีวิต!`);
        render();
      }
    }

    function revealGameOver() {
      if (confirm('คุณต้องการจบเกมและเฉลยบทบาทของทุกคนใช่หรือไม่?')) {
        if (timer) clearInterval(timer);
        gameState = 'game_over'; render();
      }
    }

    function restartGame() {
      if (timer) clearInterval(timer); timer = null;
      gameState = 'setup'; render();
    }

    render();
  </script>
</body>
</html>
