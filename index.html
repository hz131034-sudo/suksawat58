<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf Mobile Game - Balanced Deck Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Kanit', sans-serif; } 
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- แถบป้ายข้อความแจ้งเตือนภาษาไทย -->
  <div id="voiceBanner" class="fixed top-3 left-3 right-3 max-w-md mx-auto bg-amber-400 text-slate-900 font-bold p-3 rounded-2xl shadow-2xl border-2 border-amber-200 text-xs flex items-center justify-between transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none z-50">
    <div class="flex items-center gap-2.5 flex-1 pr-2">
      <span class="text-xl animate-bounce">🗣️</span>
      <span id="voiceText" class="text-xs leading-snug">กำลังเตรียมคำสั่ง...</span>
    </div>
    <button onclick="hideVoiceBanner()" class="bg-slate-900/20 hover:bg-slate-900/40 text-slate-900 px-2 py-1 rounded-lg text-[10px] font-extrabold">✕ ปิด</button>
  </div>

  <div id="app" class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 my-4"></div>

  <script>
    let players = [];
    let currentRevealIndex = 0;
    let gameState = 'setup'; // setup, reveal, pre_night, night_intro, night_wolf, night_seer, night_doctor, night_witch, night_waiting, day, game_over
    let timer = null;
    let timeLeft = 120;
    let preNightTimeLeft = 120;
    let nightAction = { wolfTarget: null, doctorSave: null, seerCheck: null, witchSaved: false, witchPoisonTarget: null };
    let witchHealUsed = false;
    let witchPoisonUsed = false;
    let seerCheckedThisNight = false;
    let nightLog = "";
    let transitionTimer = 5;

    let audioCtx = null;
    let bannerTimeout = null;
    let speechUnlocked = false;
    let thaiVoice = null;

    // นิยามบทบาททั้งหมดและโควตาการเลือก
    const roleDefs = [
      { id: 'wolf', name: 'หมาป่า', icon: '🐺', desc: 'เลือกเหยื่อที่จะกำจัดในตอนกลางคืน', max: 4 },
      { id: 'seer', name: 'ผู้ทำนาย', icon: '🔮', desc: 'ส่องดูฝ่ายดี/ฝ่ายร้ายของเพื่อนคืนละ 1 คน', max: 4 },
      { id: 'doctor', name: 'หมอ', icon: '🩺', desc: 'เลือกปกป้องผู้เล่น 1 คนจากการถูกทำร้าย', max: 4 },
      { id: 'witch', name: 'แม่มด', icon: '🧙‍♀️', desc: 'มียาช่วยชีวิต 1 ขวด และยาพิษ 1 ขวด', max: 4 },
      { id: 'hunter', name: 'ฮันเตอร์', icon: '🏹', desc: 'เมื่อตาย สามารถยิงผู้เล่นอื่นตายตามได้ 1 คน', max: 4 },
      { id: 'fool', name: 'คนบ้า', icon: '🤪', desc: 'เป้าหมายคือหลอกให้คนอื่นโหวตประหารตัวเอง', max: 4 },
      { id: 'villager', name: 'ชาวบ้าน', icon: '👨‍🌾', desc: 'ตามหาและโหวตกำจัดหมาป่าในตอนกลางวัน', max: 6 }
    ];

    // จำนวนการ์ดเริ่มต้น
    let roleCounts = {
      wolf: 1,
      seer: 1,
      doctor: 1,
      witch: 0,
      hunter: 0,
      fool: 0,
      villager: 1
    };

    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        thaiVoice = voices.find(v => v.lang.includes('th') || v.lang.includes('TH') || v.name.includes('Thai') || v.name.includes('Kanya') || v.name.includes('Narisa'));
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        if (!speechUnlocked) {
          const dummy = new SpeechSynthesisUtterance(' ');
          dummy.volume = 0.01;
          dummy.rate = 10;
          window.speechSynthesis.speak(dummy);
          speechUnlocked = true;
        }
      }
    }

    function playChime(type) {
      initAudio();
      try {
        const now = audioCtx.currentTime;
        if (type === 'wolf') {
          [220, 196, 174, 146].forEach((freq, i) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + i*0.22);
            gain.gain.setValueAtTime(0.25, now + i*0.22);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.22 + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i*0.22); osc.stop(now + i*0.22 + 0.5);
          });
        } else if (type === 'seer' || type === 'doctor' || type === 'witch') {
          [587.33, 880, 1174.66].forEach((freq, i) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i*0.18);
            gain.gain.setValueAtTime(0.3, now + i*0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.18 + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i*0.18); osc.stop(now + i*0.18 + 0.5);
          });
        } else if (type === 'morning') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i*0.16);
            gain.gain.setValueAtTime(0.35, now + i*0.16);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.16 + 0.7);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now + i*0.16); osc.stop(now + i*0.16 + 0.7);
          });
        } else {
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch(e) { console.error(e); }
    }

    function showVoiceBanner(text, duration = 8000) {
      const banner = document.getElementById('voiceBanner');
      const voiceText = document.getElementById('voiceText');
      if (banner && voiceText) {
        voiceText.innerText = text;
        banner.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
        banner.classList.add('opacity-100', 'translate-y-0');

        if (bannerTimeout) clearTimeout(bannerTimeout);
        bannerTimeout = setTimeout(() => { hideVoiceBanner(); }, duration);
      }
    }

    function hideVoiceBanner() {
      const banner = document.getElementById('voiceBanner');
      if (banner) {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
      }
    }

    function announceCommand(text, chimeType, callback) {
      initAudio();
      showVoiceBanner(text, 8000);
      playChime(chimeType);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'th-TH';
        utterance.rate = 1.10;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        if (!thaiVoice) loadVoices();
        if (thaiVoice) utterance.voice = thaiVoice;

        let handled = false;
        const finish = () => {
          if (!handled) {
            handled = true;
            if (callback) callback();
          }
        };

        utterance.onend = finish;
        utterance.onerror = (e) => { finish(); };

        window.speechSynthesis.speak(utterance);
        setTimeout(finish, 5000);
      } else {
        setTimeout(() => { if (callback) callback(); }, 2000);
      }
    }

    function testVoice() {
      announceCommand('ทดสอบเสียงพูดภาษาไทยครับ ความเร็วพอดีไหมครับ', 'morning');
    }

    function updateRoleCount(roleId, change) {
      const def = roleDefs.find(r => r.id === roleId);
      if (!def) return;
      const current = roleCounts[roleId] || 0;
      const next = current + change;
      if (next >= 0 && next <= def.max) {
        roleCounts[roleId] = next;
        render();
      }
    }

    function getNextNightState(current) {
      const hasAliveRole = (roleId) => players.some(p => p.alive && p.role.id === roleId);

      if (current === 'night_wolf') {
        if (hasAliveRole('seer')) return { state: 'night_seer', msg: 'หมาป่า หลับตาลง... ผู้ทำนาย ตื่นขึ้นมาส่องดูฝ่ายดีหรือฝ่ายร้าย', chime: 'seer' };
        if (hasAliveRole('doctor')) return { state: 'night_doctor', msg: 'หมาป่า หลับตาลง... หมอ ตื่นขึ้นมาคุ้มกัน', chime: 'doctor' };
        if (hasAliveRole('witch')) return { state: 'night_witch', msg: 'หมาป่า หลับตาลง... แม่มด ตื่นขึ้นมาเลือกใช้ยา', chime: 'witch' };
        return { state: 'day', msg: '', chime: 'morning' };
      }
      if (current === 'night_seer') {
        if (hasAliveRole('doctor')) return { state: 'night_doctor', msg: 'ผู้ทำนาย หลับตาลง... หมอ ตื่นขึ้นมาคุ้มกัน', chime: 'doctor' };
        if (hasAliveRole('witch')) return { state: 'night_witch', msg: 'ผู้ทำนาย หลับตาลง... แม่มด ตื่นขึ้นมาเลือกใช้ยา', chime: 'witch' };
        return { state: 'day', msg: '', chime: 'morning' };
      }
      if (current === 'night_doctor') {
        if (hasAliveRole('witch')) return { state: 'night_witch', msg: 'หมอ หลับตาลง... แม่มด ตื่นขึ้นมาเลือกใช้ยา', chime: 'witch' };
        return { state: 'day', msg: '', chime: 'morning' };
      }
      if (current === 'night_witch') {
        return { state: 'day', msg: '', chime: 'morning' };
      }
      return { state: 'day', msg: '', chime: 'morning' };
    }

    function render() {
      const app = document.getElementById('app');
      
      // 1. หน้าตั้งค่าเกม & จัดสำรับบทบาท
      if (gameState === 'setup') {
        const totalCards = Object.values(roleCounts).reduce((a, b) => a + b, 0);
        const isCountMatch = totalCards === players.length && players.length >= 4;

        app.innerHTML = `
          <h1 class="text-xl font-bold text-center text-amber-400 mb-1">🐺 เกมหมาป่าปรับแต่งบทบาท</h1>
          <p class="text-[11px] text-slate-400 text-center mb-3">ใส่ชื่อผู้เล่นและจัดสำรับบทบาทการ์ดให้พอดีกัน</p>

          <button onclick="testVoice()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold rounded-xl text-xs mb-3 shadow flex items-center justify-center gap-2">
            🔊 ทดสอบเสียงพูดภาษาไทย (แบบเร็ว)
          </button>

          <!-- ส่วนที่ 1: รายชื่อผู้เล่น -->
          <div class="bg-slate-700/40 p-3 rounded-xl border border-slate-600 mb-3">
            <h3 class="font-bold text-amber-300 text-xs mb-2">1. รายชื่อผู้เล่น (${players.length} คน)</h3>
            <div class="flex gap-2 mb-2">
              <input id="nameInput" type="text" placeholder="พิมพ์ชื่อผู้เล่น..." class="flex-1 px-3 py-1.5 bg-slate-800 border border-slate-600 rounded-lg text-white text-xs">
              <button onclick="addPlayer()" class="bg-amber-500 hover:bg-amber-600 font-bold px-3 py-1.5 rounded-lg text-slate-900 text-xs">+ เพิ่ม</button>
            </div>

            <div class="space-y-1.5 max-h-32 overflow-y-auto">
              ${players.length === 0 ? '<p class="text-center text-slate-500 text-xs py-1">เพิ่มผู้เล่นอย่างน้อย 4 คน</p>' : ''}
              ${players.map((p, i) => `
                <div class="flex justify-between items-center bg-slate-800/80 px-2.5 py-1 rounded-lg text-xs">
                  <span>${i+1}. ${p.name}</span>
                  <button onclick="removePlayer(${i})" class="text-red-400 font-bold text-xs">✕</button>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- ส่วนที่ 2: จัดสำรับบทบาท -->
          <div class="bg-slate-700/40 p-3 rounded-xl border border-slate-600 mb-4">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-amber-300 text-xs">2. จัดสำรับบทบาทการ์ด</h3>
              <span class="text-xs font-bold ${totalCards === players.length ? 'text-emerald-400' : 'text-amber-400'}">
                ${totalCards} / ${players.length} ใบ
              </span>
            </div>

            <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1">
              ${roleDefs.map(r => `
                <div class="flex items-center justify-between bg-slate-800/80 px-2.5 py-1.5 rounded-lg text-xs">
                  <div class="flex items-center gap-2">
                    <span class="text-base">${r.icon}</span>
                    <div>
                      <span class="font-bold text-white">${r.name}</span>
                      <span class="text-[9px] text-slate-400 block">${r.desc}</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button onclick="updateRoleCount('${r.id}', -1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded font-bold text-white text-xs flex items-center justify-center">-</button>
                    <span class="w-4 text-center font-bold text-amber-300 text-xs">${roleCounts[r.id] || 0}</span>
                    <button onclick="updateRoleCount('${r.id}', 1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded font-bold text-white text-xs flex items-center justify-center">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- แจ้งเตือนความถูกต้อง -->
          ${players.length < 4 ? `<p class="text-center text-xs text-amber-400 mb-2 font-semibold">⚠️ กรุณาเพิ่มผู้เล่นอย่างน้อย 4 คนขึ้นไป</p>` : ''}
          ${players.length >= 4 && totalCards !== players.length ? `
            <p class="text-center text-xs text-red-400 mb-2 font-semibold">
              ⚠️ การ์ดรวม (${totalCards} ใบ) ${totalCards < players.length ? `ขาดอีก ${players.length - totalCards} ใบ` : `เกินอยู่ ${totalCards - players.length} ใบ`} ให้เท่าจำนวนผู้เล่น (${players.length} คน)
            </p>
          ` : ''}

          <button onclick="startGame()" ${!isCountMatch ? 'disabled' : ''} class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-30 font-bold rounded-xl text-slate-900 text-sm shadow-lg">
            🎮 เริ่มสุ่มแจกบทบาท (${players.length} คน)
          </button>
        `;
      } 

      // 2. หน้าสุ่มบทบาท
      else if (gameState === 'reveal') {
        const p = players[currentRevealIndex];
        app.innerHTML = `
          <div class="text-center space-y-4">
            <span class="text-xs font-semibold px-3 py-1 bg-amber-400/20 text-amber-400 rounded-full">ขั้นตอนสุ่มบทบาทลับ</span>
            <h2 class="text-slate-300 text-sm mt-2">ยื่นมือถือให้เพื่อนชื่อ:</h2>
            <h1 class="text-3xl font-extrabold text-amber-400">${p.name}</h1>
            
            <div id="secretCard" class="my-6 p-6 bg-slate-700/40 rounded-xl border border-dashed border-slate-600">
              <p class="text-slate-400 text-xs">กดปุ่มด้านล่างเมื่อถือมือถือคนเดียวแล้ว</p>
            </div>

            <div id="actionArea">
              <button onclick="revealRole()" class="w-full py-3 bg-amber-500 font-bold rounded-xl text-slate-900 text-sm shadow-lg">
                👁️ กดเพื่อแอบดูบทบาท
              </button>
            </div>
          </div>
        `;
      }

      // 2.5 พูดคุยก่อนเริ่มคืนแรก
      else if (gameState === 'pre_night') {
        app.innerHTML = `
          <div class="text-center space-y-4">
            <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 font-bold text-xs">
              🗣️ เฟสพูดคุยก่อนเริ่มคืนแรก
            </div>
            <h2 class="text-xl font-bold text-amber-400">พูดคุย & แนะนำตัว</h2>
            <p class="text-xs text-slate-300 bg-slate-700/50 p-3 rounded-xl border border-slate-600 leading-relaxed">
              แจกบทบาทครบทุกคนแล้ว! <br><b class="text-amber-300">ให้ทุกคนพูดคุย ทักทาย หรือวางแผนกันก่อน</b>ที่จะเริ่มเข้าสู่ช่วงกลางคืนคืนแรก
            </p>

            <h1 class="text-4xl font-extrabold text-white my-2">${Math.floor(preNightTimeLeft / 60)}:${(preNightTimeLeft % 60).toString().padStart(2, '0')}</h1>

            <div class="flex justify-center gap-2">
              <button onclick="togglePreNightTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">▶️/⏸️ จับเวลา</button>
              <button onclick="resetPreNightTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">🔄 รีเซ็ต</button>
            </div>

            <button onclick="startNightPhase()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm shadow-lg mt-4">
              🌙 พร้อมแล้ว เข้าสู่ช่วงกลางคืน
            </button>
          </div>
        `;
      }

      // 3. เริ่มต้นกลางคืน
      else if (gameState === 'night_intro') {
        app.innerHTML = `
          <div class="text-center space-y-4">
            <div class="text-5xl">🌙</div>
            <h2 class="text-xl font-bold text-indigo-400">เข้าสู่ช่วงกลางคืน</h2>
            <p class="text-sm text-slate-300 leading-relaxed bg-slate-700/50 p-4 rounded-xl border border-slate-600">
              🔊 <b class="text-amber-400">วางมือถือไว้ตรงกลาง แล้วกดเริ่ม</b><br>
              ระบบจะเปิดเสียงสั่งหลับตาและขานเรียกบทบาทให้อัตโนมัติ
            </p>
            <button onclick="startNightSequence()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-sm shadow-lg">
              ▶️ เริ่มสั่งหลับตา & ขานบทบาท
            </button>
          </div>
        `;
      }

      // 4. หมาป่า
      else if (gameState === 'night_wolf') {
        const aliveTargets = players.filter(p => p.alive && p.role.id !== 'wolf');
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-red-400 text-center">🐺 หมาป่า: เลือกเหยื่อ 1 คน</h2>
            <p class="text-xs text-slate-400 text-center">แอบหยิบมือถือมาเลือกลบชาวบ้าน 1 คน:</p>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              ${aliveTargets.map(p => `
                <button onclick="selectWolfTarget('${p.name}')" class="w-full p-3 bg-slate-700 hover:bg-red-900/40 border border-slate-600 hover:border-red-500 rounded-xl text-left font-bold text-sm">
                  🎯 ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 5. พักรอสลับบทบาท
      else if (gameState === 'night_waiting') {
        app.innerHTML = `
          <div class="text-center space-y-4 py-8">
            <div class="text-4xl animate-pulse">⏳</div>
            <h2 class="text-lg font-bold text-amber-400">กำลังสลับบทบาท...</h2>
            <p class="text-xs text-slate-400">หลับตาแล้ววางมือถือไว้ที่เดิม (${transitionTimer} วินาที)</p>
            <div class="text-4xl font-extrabold text-white">${transitionTimer}</div>
          </div>
        `;
      }

      // 6. ผู้ทำนาย (ส่องดูได้แค่ฝ่ายดี หรือ ฝ่ายร้าย)
      else if (gameState === 'night_seer') {
        const aliveSeer = players.find(p => p.role.id === 'seer' && p.alive);
        if (!aliveSeer) {
          const next = getNextNightState('night_seer');
          startTransition(next.state, next.msg, next.chime);
          return;
        }
        const otherPlayers = players.filter(p => p.alive && p.role.id !== 'seer');
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-purple-400 text-center">🔮 ผู้ทำนาย: เลือกส่องดูฝ่าย (เลือกได้คนเดียว)</h2>
            <div id="seerResult"></div>
            <div class="space-y-2 max-h-48 overflow-y-auto">
              ${otherPlayers.map(p => `
                <button onclick="checkSeerRole('${p.name}', '${p.role.id}')" class="seer-btn w-full p-3 bg-slate-700 hover:bg-purple-900/40 border border-slate-600 rounded-xl text-left font-bold text-sm">
                  🔍 ส่องดูฝ่ายของ ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 7. หมอ
      else if (gameState === 'night_doctor') {
        const aliveDoctor = players.find(p => p.role.id === 'doctor' && p.alive);
        if (!aliveDoctor) {
          const next = getNextNightState('night_doctor');
          startTransition(next.state, next.msg, next.chime);
          return;
        }
        const alivePlayers = players.filter(p => p.alive);
        app.innerHTML = `
          <div class="space-y-4">
            <h2 class="text-lg font-bold text-emerald-400 text-center">🩺 หมอ: เลือกคนที่จะคุ้มกัน</h2>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              ${alivePlayers.map(p => `
                <button onclick="selectDoctorSave('${p.name}')" class="w-full p-3 bg-slate-700 hover:bg-emerald-900/40 border border-slate-600 rounded-xl text-left font-bold text-sm">
                  🛡️ ปกป้อง ${p.name}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 8. แม่มด
      else if (gameState === 'night_witch') {
        const aliveWitch = players.find(p => p.role.id === 'witch' && p.alive);
        if (!aliveWitch) {
          const next = getNextNightState('night_witch');
          startTransition(next.state, next.msg, next.chime);
          return;
        }
        const aliveOthers = players.filter(p => p.alive && p.role.id !== 'witch');
        app.innerHTML = `
          <div class="space-y-3">
            <h2 class="text-lg font-bold text-pink-400 text-center">🧙‍♀️ แม่มด: เลือกใช้เวทมนตร์</h2>
            
            <div class="p-3 bg-slate-700/80 rounded-xl text-xs text-slate-200 border border-slate-600">
              🐺 หมาป่าเลือกทำร้ายคืนนี้: <b class="text-amber-300 font-bold">${nightAction.wolfTarget || 'ไม่มี'}</b>
            </div>

            <div class="space-y-2">
              <button onclick="witchSaveAction()" ${witchHealUsed || !nightAction.wolfTarget ? 'disabled' : ''} class="w-full p-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 font-bold rounded-xl text-xs text-white">
                🧪 ใช้ยาช่วยชีวิต ${nightAction.wolfTarget ? nightAction.wolfTarget : ''} ${witchHealUsed ? '(ใช้ไปแล้ว)' : ''}
              </button>

              <div class="border-t border-slate-700 pt-2">
                <p class="text-[11px] text-slate-400 mb-1">☠️ ใช้ยาพิษสังหารผู้เล่น (ขวดเดียวทั้งเกม):</p>
                <div class="space-y-1.5 max-h-28 overflow-y-auto">
                  ${aliveOthers.map(p => `
                    <button onclick="witchPoisonAction('${p.name}')" ${witchPoisonUsed ? 'disabled' : ''} class="w-full p-2 bg-slate-700 hover:bg-red-900/40 disabled:opacity-40 text-left rounded-lg text-xs font-semibold">
                      ☠️ ใส่ยาพิษ ${p.name}
                    </button>
                  `).join('')}
                </div>
              </div>

              <button onclick="witchFinish()" class="w-full py-2.5 bg-slate-600 hover:bg-slate-500 font-bold rounded-xl text-xs text-white mt-2">
                ⏭️ ข้าม / ยืนยันคำสั่ง
              </button>
            </div>
          </div>
        `;
      }

      // 9. กลางวัน
      else if (gameState === 'day') {
        app.innerHTML = `
          <div class="text-center">
            <div class="inline-block px-4 py-1 rounded-full bg-amber-500/20 text-amber-400 font-bold text-xs mb-1">
              ☀️ เฟสกลางวัน (ถกเถียง & โหวต)
            </div>
            
            ${nightLog ? `<div class="my-2 p-3 bg-slate-700/80 rounded-xl border border-amber-500/30 text-xs text-amber-200 font-semibold">${nightLog}</div>` : ''}

            <h2 class="text-4xl font-extrabold text-white my-1">${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}</h2>
            
            <div class="flex justify-center gap-2 my-2">
              <button onclick="toggleTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">▶️/⏸️ จับเวลา/หยุด</button>
              <button onclick="resetTimer()" class="px-3 py-1.5 text-xs bg-slate-700 hover:bg-slate-600 rounded-lg">🔄 รีเซ็ต</button>
            </div>
          </div>

          <div class="border-t border-slate-700 pt-3 mt-2">
            <div class="flex justify-between items-center mb-2">
              <h3 class="font-bold text-slate-300 text-xs">รายชื่อผู้เล่น:</h3>
              <span class="text-[10px] text-slate-400">*บทบาทผู้เสียชีวิตถูกซ่อนไว้</span>
            </div>
            
            <div class="space-y-2 max-h-44 overflow-y-auto">
              ${players.map((p, i) => `
                <div class="flex justify-between items-center p-2 rounded-xl ${p.alive ? 'bg-slate-700/60' : 'bg-red-950/30 border border-red-900/30 opacity-60'}">
                  <div>
                    <span class="font-bold text-sm ${p.alive ? 'text-white' : 'line-through text-red-400'}">${p.name}</span>
                    <span class="text-[10px] text-slate-400 block">${p.alive ? 'มีชีวิตอยู่' : '💀 เสียชีวิตแล้ว'}</span>
                  </div>
                  ${p.alive ? `<button onclick="voteKill(${i})" class="px-2.5 py-1 text-xs bg-red-500/20 hover:bg-red-500/40 text-red-400 rounded-lg border border-red-500/30">🗳️ โหวตประหาร</button>` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="flex gap-2 mt-4">
            <button onclick="startNightPhase()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white text-xs">
              🌙 เข้าร่วมเฟสกลางคืน
            </button>
            <button onclick="revealGameOver()" class="py-2.5 px-3 bg-red-900/60 hover:bg-red-800 text-red-200 font-bold rounded-xl text-xs">
              🏁 จบเกม
            </button>
          </div>
        `;
      }

      // 10. จบเกม
      else if (gameState === 'game_over') {
        app.innerHTML = `
          <div class="text-center space-y-3">
            <h1 class="text-2xl font-extrabold text-amber-400">🏁 จบเกม & เฉลยบทบาท</h1>
            <div class="space-y-2 max-h-64 overflow-y-auto my-4">
              ${players.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-700/80 rounded-xl border ${p.alive ? 'border-emerald-500/40' : 'border-red-500/40'}">
                  <div class="text-left">
                    <span class="font-bold text-sm text-white">${p.name}</span>
                    <span class="text-[10px] block ${p.alive ? 'text-emerald-400' : 'text-red-400'}">${p.alive ? '🟢 รอดชีวิต' : '💀 เสียชีวิต'}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-lg mr-1">${p.role.icon}</span>
                    <span class="font-bold text-sm text-amber-300">${p.role.name}</span>
                  </div>
                </div>
              `).join('')}
            </div>
            <button onclick="restartGame()" class="w-full py-3 bg-amber-500 font-bold rounded-xl text-slate-900 text-sm">
              🔄 เริ่มเล่นเกมใหม่
            </button>
          </div>
        `;
      }
    }

    function addPlayer() {
      initAudio();
      const input = document.getElementById('nameInput');
      if (input.value.trim()) {
        players.push({ name: input.value.trim(), role: null, alive: true });
        input.value = ''; render();
      }
    }
    function removePlayer(i) { initAudio(); players.splice(i, 1); render(); }

    function startGame() {
      initAudio();
      let deck = [];
      roleDefs.forEach(r => {
        const count = roleCounts[r.id] || 0;
        for (let i = 0; i < count; i++) {
          deck.push({ ...r });
        }
      });

      const shuffled = [...deck].sort(() => Math.random() - 0.5);
      players.forEach((p, i) => { p.role = shuffled[i]; p.alive = true; });
      
      witchHealUsed = false;
      witchPoisonUsed = false;
      currentRevealIndex = 0; 
      gameState = 'reveal'; 
      render();
    }

    function revealRole() {
      initAudio();
      const p = players[currentRevealIndex];
      document.getElementById('secretCard').innerHTML = `
        <div class="text-4xl mb-1">${p.role.icon}</div>
        <h3 class="text-lg font-bold text-amber-400">${p.role.name}</h3>
        <p class="text-xs text-slate-300 mt-1">${p.role.desc}</p>
      `;
      document.getElementById('actionArea').innerHTML = `
        <button onclick="nextPlayer()" class="w-full py-3 bg-emerald-500 font-bold rounded-xl text-slate-900 text-sm">
          🙈 ซ่อนบทบาท & ส่งต่อคนถัดไป
        </button>
      `;
    }

    function nextPlayer() {
      initAudio();
      currentRevealIndex++;
      if (currentRevealIndex >= players.length) {
        startPreNightPhase();
      } else { render(); }
    }

    function startPreNightPhase() {
      gameState = 'pre_night';
      preNightTimeLeft = 120;
      render();
      announceCommand('แจกบทบาทเสร็จสิ้นแล้ว เชิญทุกคนพูดคุยทักทายกันก่อนเข้าสู่ช่วงกลางคืนครับ', 'morning');
    }

    function togglePreNightTimer() {
      playChime('beep');
      if (timer) { clearInterval(timer); timer = null; }
      else {
        timer = setInterval(() => {
          if (preNightTimeLeft > 0) {
            preNightTimeLeft--;
            if (preNightTimeLeft === 0) {
              announceCommand('หมดเวลาพูดคุยแล้วครับ พร้อมเข้าสู่ช่วงกลางคืน', 'morning');
            }
            render();
          }
        }, 1000);
      }
    }

    function resetPreNightTimer() {
      if (timer) clearInterval(timer); timer = null; preNightTimeLeft = 120; render();
    }

    function startNightPhase() {
      initAudio();
      if (timer) clearInterval(timer); timer = null;
      nightAction = { wolfTarget: null, doctorSave: null, seerCheck: null, witchSaved: false, witchPoisonTarget: null };
      seerCheckedThisNight = false;
      gameState = 'night_intro'; render();
    }

    function startNightSequence() {
      announceCommand('ผู้เล่นทุกคน หลับตาลง... หมาป่า ตื่นขึ้นมาเลือกเหยื่อ', 'wolf', () => {
        gameState = 'night_wolf'; render();
      });
    }

    function selectWolfTarget(name) {
      nightAction.wolfTarget = name;
      const next = getNextNightState('night_wolf');
      startTransition(next.state, next.msg, next.chime);
    }

    // แก้ไข: แสดงผลเฉพาะฝ่ายดี หรือ ฝ่ายร้าย
    function checkSeerRole(name, roleId) {
      if (seerCheckedThisNight) return;
      seerCheckedThisNight = true;

      const btns = document.querySelectorAll('.seer-btn');
      btns.forEach(b => {
        b.disabled = true;
        b.classList.add('opacity-40', 'cursor-not-allowed');
      });

      const isWolf = (roleId === 'wolf');
      const sideText = isWolf ? 'ฝ่ายร้าย 🐺' : 'ฝ่ายดี 😇';

      document.getElementById('seerResult').innerHTML = `
        <div class="p-3 bg-purple-950/80 border border-purple-500 rounded-xl text-center mb-3">
          <p class="text-xs text-purple-200">${name} อยู่: <b class="${isWolf ? 'text-red-400' : 'text-emerald-400'} text-sm font-bold">${sideText}</b></p>
        </div>
      `;

      setTimeout(() => {
        const next = getNextNightState('night_seer');
        startTransition(next.state, next.msg, next.chime);
      }, 2500);
    }

    function selectDoctorSave(name) {
      nightAction.doctorSave = name;
      const next = getNextNightState('night_doctor');
      startTransition(next.state, next.msg, next.chime);
    }

    function witchSaveAction() {
      nightAction.witchSaved = true;
      witchHealUsed = true;
      alert(`🧪 ใช้ยาช่วยชีวิต ${nightAction.wolfTarget} สำเร็จ`);
      render();
    }

    function witchPoisonAction(name) {
      nightAction.witchPoisonTarget = name;
      witchPoisonUsed = true;
      alert(`☠️ วางยาพิษใส่ ${name} สำเร็จ`);
      render();
    }

    function witchFinish() {
      const next = getNextNightState('night_witch');
      startTransition(next.state, next.msg, next.chime);
    }

    function startTransition(nextState, speechMessage, chimeType) {
      gameState = 'night_waiting';
      transitionTimer = 5;
      render();

      const countdown = setInterval(() => {
        transitionTimer--;
        if (transitionTimer <= 0) {
          clearInterval(countdown);
          if (nextState === 'day') {
            const morningMsg = processNightResults();
            announceCommand(morningMsg, 'morning');
          } else {
            announceCommand(speechMessage, chimeType, () => {
              gameState = nextState;
              render();
            });
          }
        } else {
          render();
        }
      }, 1000);
    }

    // แก้ไข: สร้างข้อความเสียงประกาศตอนเช้าเกี่ยวกับผู้เสียชีวิต
    function processNightResults() {
      let deadList = [];

      // 1. ตรวจสอบการฆ่าของหมาป่า
      if (nightAction.wolfTarget) {
        const isSavedByDoctor = (nightAction.wolfTarget === nightAction.doctorSave);
        const isSavedByWitch = nightAction.witchSaved;
        if (!isSavedByDoctor && !isSavedByWitch) {
          deadList.push(nightAction.wolfTarget);
        }
      }

      // 2. ตรวจสอบยาพิษแม่มด
      if (nightAction.witchPoisonTarget && !deadList.includes(nightAction.witchPoisonTarget)) {
        deadList.push(nightAction.witchPoisonTarget);
      }

      let hunterTriggered = [];
      deadList.forEach(name => {
        const p = players.find(player => player.name === name);
        if (p) {
          p.alive = false;
          if (p.role.id === 'hunter') {
            hunterTriggered.push(p);
          }
        }
      });

      let morningSpeech = "";
      if (deadList.length > 0) {
        const deadNamesText = deadList.join(' และ ');
        nightLog = `📢 เมื่อคืนนี้ 💀 ${deadNamesText} เสียชีวิต!`;
        morningSpeech = `เช้าแล้ว ทุกคนตื่นได้! เมื่อคืนนี้ ${deadNamesText} เสียชีวิตครับ`;
      } else {
        nightLog = `📢 เมื่อคืนนี้เป็นคืนที่เงียบสงบ ไม่มีใครเสียชีวิต!`;
        morningSpeech = `เช้าแล้ว ทุกคนตื่นได้! เมื่อคืนนี้เป็นคืนที่เงียบสงบ ไม่มีใครเสียชีวิตครับ`;
      }

      resetTimer();
      gameState = 'day'; 
      render();

      if (hunterTriggered.length > 0) {
        setTimeout(() => {
          hunterTriggered.forEach(h => triggerHunterShot(h));
        }, 500);
      }

      return morningSpeech;
    }

    function triggerHunterShot(hunterPlayer) {
      const aliveTargets = players.filter(p => p.alive);
      if (aliveTargets.length === 0) return;
      
      let targetName = prompt(`🏹 [ฮันเตอร์] ${hunterPlayer.name} เสียชีวิต!\nพิมพ์ชื่อผู้เล่นที่ต้องการยิงสังหารตาม (หรือกด Cancel เพื่อไม่ยิง):\n\nรายชื่อผู้เล่นที่ยังรอด: ${aliveTargets.map(p=>p.name).join(', ')}`);
      if (targetName) {
        const target = players.find(p => p.name.trim().toLowerCase() === targetName.trim().toLowerCase() && p.alive);
        if (target) {
          target.alive = false;
          alert(`🏹 ${hunterPlayer.name} (ฮันเตอร์) ได้ยิงสังหาร 💀 ${target.name} ตายตามไปด้วย!`);
          render();
        } else {
          alert('ไม่พบชื่อผู้เล่นดังกล่าว');
        }
      }
    }

    function toggleTimer() {
      playChime('beep');
      if (timer) { clearInterval(timer); timer = null; }
      else {
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            if (timeLeft === 0) {
              announceCommand('หมดเวลาถกเถียงแล้วครับ!', 'morning');
            }
            render();
          }
        }, 1000);
      }
    }

    function resetTimer() { if (timer) clearInterval(timer); timer = null; timeLeft = 120; render(); }
    
    function voteKill(i) {
      playChime('beep');
      const victim = players[i];
      if (confirm(`ยืนยันผลโหวตประหาร ${victim.name}?`)) {
        victim.alive = false;
        alert(`⚖️ ${victim.name} ถูกโหวตประหารชีวิต!`);

        if (victim.role.id === 'fool') {
          announceCommand(`คนบ้า ถูกโหวตประหารสำเร็จ! คนบ้าเป็นผู้ชนะในเกมนี้ครับ!`, 'morning');
          alert(`🎉 🤪 ${victim.name} (คนบ้า) ถูกโหวตประหารสำเร็จ! คนบ้าชนะเกมนี้!`);
        } 
        else if (victim.role.id === 'hunter') {
          triggerHunterShot(victim);
        }

        render();
      }
    }

    function revealGameOver() {
      if (confirm('คุณต้องการจบเกมและเฉลยบทบาทของทุกคนใช่หรือไม่?')) {
        if (timer) clearInterval(timer);
        gameState = 'game_over'; render();
      }
    }

    function restartGame() {
      if (timer) clearInterval(timer); timer = null;
      gameState = 'setup'; render();
    }

    render();
  </script>
</body>
</html>
